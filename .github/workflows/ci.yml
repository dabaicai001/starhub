name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 能离线验的门分四类:域单测(sidecar-rust / Go / 前端纯逻辑)、StarHub 自己的
# vitest 套件、插件组装,以及 **把 tarball 装进官方宿主进程的冒烟**。最后一类是
# 关键门——它证的是「StarHub 插件装进官方 dsh 之后真的能跑」。
#
# 不跑 Electron、也不自建壳:品牌安装包已退役(v0.143.0),发布物是插件 bundle。

jobs:
  verify:
    name: Verify / ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86_64
            runner: ubuntu-24.04
          - name: ARM64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # 官方 dsh 0.2.2 的 engines 是 node >=24.9;宿主冒烟也要 >=24.2
          # (`import.meta.main` 自决是否执行 CLI 入口)。
          node-version: 24
          cache: npm

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          # 与生成 pnpm-lock.yaml 的本地版本一致,避免 lockfile 语义漂移。
          version: 10.15.0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.25.x
          cache-dependency-path: sidecar/go.sum

      - name: Set up Rust
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0

      - name: Install frontend dependencies
        run: npm ci

      - name: Install StarHub workspace dependencies
        # P1 起 StarHub 自己的包与官方 @deepseek-ai/dsh-* 都在根 pnpm workspace 里;
        # npm ci 只装根 devDependencies,装不到 workspace 包的依赖。
        run: pnpm install --frozen-lockfile

      - name: Validate workflow YAML
        # 工作流文件本身非法时 GitHub 一个 job 都不起、秒级 failure,后面所有步骤
        # 根本不会跑——所以这道门拦在最早、最便宜的地方(贡献者本地跑同一条
        # `npm run test:workflows`)。事故与护栏的来历见
        # tests/workflows-yaml.test.mjs 顶部的注释。
        run: npm run test:workflows

      - name: Test frontend pure logic
        run: npm run test:utils

      - name: Test StarHub plugin/app unit suites
        # P1 把各包的 tests/ 迁出了 vendor;P2 起由根 workspace 的 vitest 跑
        # (packages/starhub/*/tests + apps/*/tests,含 jsdom 渲染用例)。
        run: npm run test:starhub

      - name: Test Go sidecar
        working-directory: sidecar
        run: go test ./...

      - name: Test Rust sidecar (domains + protocol)
        # sidecar-rust 是 M1 起域逻辑的新家。src-tauri 已退役(M4 第 4 步),
        # 这道门由它独担——原来的 src-tauri 全量 cargo test 内存峰值 27GB,
        # CI 上跑不动。
        # ARM64 runner 仅 16GB 内存,限制并行编译单元。
        env:
          CARGO_BUILD_JOBS: ${{ matrix.name == 'ARM64' && '2' || '4' }}
        run: cargo test --manifest-path sidecar-rust/Cargo.toml

      - name: Test Tauri→sidecar data migration
        # src-tauri 已删,但用户机器上的老数据(SQLite + Keyring)还在;导入工具
        # 与它的双跑期校验是发布链的一环(§六 / R7)。
        run: npm run test:migrate

      - name: Build plugin host/client libs
        # Host 面(9 个插件)+ Client 面(client-nav 的 tsc 与客户端半边)。
        run: |
          npm run build:lib
          npm run build:lib:client

      - name: Build sidecars and workbench dist
        # 冒烟的前置:两个 sidecar 二进制 + React 工作台 dist。
        run: |
          npm run sidecar:build
          npm run sidecar-rust:build
          npm run build:window

      - name: Assemble plugin bundle
        run: npm run plugin:bundle

      - name: 'Smoke: install the bundle into a throwaway profile and boot the official host'
        # 五条断言:包内 dist 供工作台 / API invoke 打通 / 未知命令错误通路 /
        # SSE 事件面 / 客户端半边进 boot 图。宿主用根 devDependency 的官方
        # @deepseek-ai/dsh 精确版本(0.2.2-rc.3),不再依赖自建壳产物。
        # 见 scripts/smoke-plugin-bundle.mjs。
        run: npm run smoke:plugin-bundle
