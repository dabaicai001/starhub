name: Release plugin bundle

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# 发布链(纯插件形态)。tag v*.*.* 触发:测试 → release sidecar → 插件 tarball
# → GitHub Release(npm 有 token 时同时发布,插件页可原地更新)。
#
# **不再产出品牌 Electron 安装包(v0.143.0 起的决策)。** 安装路径是:
# 用户装官方 DeepSeek Harness,再在插件页粘贴 @starhub/dsh-plugin(或本 Release
# 上的 starhub-dsh-plugin-<版本>-win-x64.tgz)。因此:
# - 不再需要签名/更新源 secrets(DOWNLOAD_TEST_RELEASE_ID、DSH_DESKTOP_*);
# - 不再需要自建壳运行时(dsh-runtime)与 provisioning 脚本;
# - 平台只有 Windows x64:包内是两个平台相关的 sidecar 二进制,其它平台等
#   sidecar 产物矩阵出来再扩。

jobs:
  windows:
    name: Windows / x86_64
    runs-on: windows-2022
    timeout-minutes: 90
    # 打包路径根治:仓库被 checkout 到 D:\a\<org>\<repo>\<repo>(~84 字符),叠加
    # pnpm deploy 嵌套 node_modules 与 mistralai/otel 超长文件名,总路径超出
    # Windows 260 字符上限 → electron-builder 的 `File /r` 报 "failed opening
    # file" 打包失败。这里把工作区 subst 到短盘符 S:\,所有 run 默认以 S:\ 为
    # working-directory,最长路径被压到 ~200 字符内。
    defaults:
      run:
        working-directory: 'S:\'
    env:
      DSH_BUILD_WORKSPACE: 'S:\'
      # 注册表包名要可配置:公开 npm 上 `@starhub` scope 需要归属;换成实际拥有的
      # scope/名字时只改仓库变量,不用改代码(客户端注册 id 会随包名改写)。
      STARHUB_PLUGIN_PACKAGE_NAME: ${{ vars.STARHUB_PLUGIN_PACKAGE_NAME || '@starhub/dsh-plugin' }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Map workspace to a short drive (Windows path-length fix)
        # 必须先于 S:\ 默认 working-directory 生效:本步负责创建 subst 映射,
        # 若沿用 job 默认的 S:\ 作为 cwd,pwsh 会因 S:\ 尚不存在而无法启动
        # ("directory name is invalid")。故显式回到真实 checkout 目录执行 subst,
        # 并校验映射确实建立,失败立即中止(否则下游会冒 "dir not found" 级联报错)。
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          $ErrorActionPreference = 'Stop'
          subst S: $env:GITHUB_WORKSPACE
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path 'S:\')) {
            throw "subst S: -> $env:GITHUB_WORKSPACE failed (drive may be in use)"
          }
          Get-ChildItem S:\
          Write-Host "workspace mapped to S:\ ($env:GITHUB_WORKSPACE)"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          # 与生成 pnpm-lock.yaml 的本地版本一致,避免 lockfile 语义漂移。
          version: 10.15.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # 官方 dsh 0.2.2 的 engines 是 node >=24.9。
          node-version: 24
          cache: pnpm

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.25.x
          cache-dependency-path: sidecar/go.sum

      - name: Set up Rust
        shell: pwsh
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0

      - name: Install StarHub workspace dependencies
        # P1/P2 起插件与工作台的依赖都在根 pnpm workspace(官方 @deepseek-ai/dsh-*)。
        run: pnpm install --frozen-lockfile

      - name: Test frontend and Go sidecar
        shell: pwsh
        run: |
          npm run test:utils
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Push-Location sidecar
          go test ./...
          $testExit = $LASTEXITCODE
          Pop-Location
          exit $testExit

      - name: Test Rust sidecar
        # src-tauri 退役后域单测全在 sidecar-rust;M4 之前这道门是 src-tauri 的
        # 全量 cargo test(内存峰值 27GB,CI 上也跑不动)。
        run: scripts\cargo-sidecar.bat test

      - name: Build release sidecars
        # 包内 sidecar:tarball 里就是这两个;release 构建。
        run: |
          npm run sidecar:build:release
          npm run sidecar-rust:build:release

      - name: Build plugin host/client libs
        # 以前这两步由 vendor 的 package-dsh-runtime 顺带编掉;vendor 删除后必须显式跑,
        # 否则 tarball 组装会因为缺 packages/starhub/*/lib 直接 fail loud。
        run: |
          npm run build:lib
          npm run build:lib:client

      - name: Build StarHub React window resources
        # 产物由 tarball 里的 host-static/dist 承载(/starhub-react/ 路由)。
        run: npm run build:window

      - name: Assemble the pure-plugin bundle tarball
        # 发布资产(libs / 工作台 dist / 两个 sidecar)在这里一次产出,不另开 workflow。
        #
        # 直接 node 调用:`npm run plugin:bundle -- --pack` 在 Windows PowerShell 下
        # 会被吞掉 `--pack`(踩坑记录 §61),CI 的 windows runner 默认就是 pwsh。
        run: node scripts/build-plugin-bundle.mjs --pack --name "$env:STARHUB_PLUGIN_PACKAGE_NAME"

      - name: Verify plugin tarball contents
        # 包体是「装完能不能跑」的全部:两个 sidecar、工作台 dist、客户端半边必须
        # 真的在 tarball 里,且不得夹带 sourcemap(踩坑记录 §59/§60 之外的体积坑)。
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $asset = (Get-ChildItem starhub-dsh-plugin-*.tgz | Select-Object -First 1).Name
          if (-not $asset) { throw '没产出 starhub-dsh-plugin-*.tgz' }
          $entries = tar -tzf $asset
          $required = @(
            'package/package.json',
            'package/README.md',
            'package/cordis.patch.yml',
            'package/bridge/sidecar/starhub-sidecar-rust.exe',
            'package/bridge/sidecar/starhub-sidecar.exe',
            'package/host-static/dist/index.html',
            'package/client-nav/lib/client.js'
          )
          foreach ($needle in $required) {
            if (-not ($entries -match [regex]::Escape($needle))) { throw "tarball 缺少 $needle" }
          }
          if ($entries -match '\.map$') { throw 'tarball 不该带 sourcemap' }
          if ($entries -match '\.tsbuildinfo$') { throw 'tarball 不该带 tsc 构建缓存' }
          Write-Host "tarball $asset 内容校验通过($($entries.Count) 项,含两个 sidecar 与工作台 dist)"

      - name: 'Smoke: plugin tarball install + host boot'
        # 复刻插件页的安装动作(pnpm add <tarball> + 选入 dsh.profile.bundles),
        # 再起宿主验五条断言(包内 dist / 包内 sidecar / 错误通路 / SSE / 客户端半边)。
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $asset = (Get-ChildItem starhub-dsh-plugin-*.tgz | Select-Object -First 1).FullName
          node scripts/smoke-plugin-bundle.mjs --spec "$asset" --timeout 180000
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Detect npm publish secret
        # 有 token 才把 bundle 发到注册表(DSH 0.2.2+ 只对注册表安装的第三方
        # bundle 显示 Versions/Update);没有 token 时 tarball 照发,只是没有原地
        # 更新,因此这里 warning 而不失败。
        id: npm-publish
        shell: pwsh
        env:
          NPM_TOKEN_VALUE: ${{ secrets.NPM_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:NPM_TOKEN_VALUE) {
            "enabled=false" >> $env:GITHUB_OUTPUT
            Write-Host "::warning::未配置 NPM_TOKEN,跳过 npm 发布:本版本只能从 tarball 安装,插件页不会出现 Versions/Update。"
          } else {
            "enabled=true" >> $env:GITHUB_OUTPUT
          }

      - name: Publish plugin bundle to npm (enables in-place Update)
        # 包名/注册表可由仓库变量覆盖;npm 侧鉴权用 NODE_AUTH_TOKEN + npmrc。
        if: steps.npm-publish.outputs.enabled == 'true'
        shell: pwsh
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          REGISTRY_URL: ${{ vars.STARHUB_PLUGIN_REGISTRY || 'https://registry.npmjs.org' }}
        run: |
          $ErrorActionPreference = 'Stop'
          $uri = [uri]$env:REGISTRY_URL
          if (-not $uri.IsAbsoluteUri -or $uri.Scheme -notin @('http', 'https')) {
            throw "STARHUB_PLUGIN_REGISTRY 必须是 http(s) 注册表地址,收到: '$env:REGISTRY_URL'"
          }
          npm config set registry $env:REGISTRY_URL
          npm config set "//$($uri.Host)/:_authToken" $env:NODE_AUTH_TOKEN
          node scripts/publish-plugin-bundle.mjs --registry $env:REGISTRY_URL
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload plugin tarball
        # 必须排在依赖签名/更新源 secrets 的那几步**之前**:装机步被跳过或失败时
        # 这一步已经上传完成,发布 job(!cancelled() 照发)才能把它挂上 Release。
        uses: actions/upload-artifact@v4
        with:
          name: starhub-plugin-bundle-${{ github.ref_name }}
          path: starhub-dsh-plugin-*.tgz
          if-no-files-found: error

      # 品牌 Electron 安装包(exe)已退役(v0.143.0):发布资产只有插件 tarball。
      # 装机链的 secrets(DOWNLOAD_TEST_RELEASE_ID / DSH_DESKTOP_*)随之删除;
      # 用户安装路径 = 官方 DSH + 插件页粘贴 @starhub/dsh-plugin(或本 Release 的 tgz)。

  publish:
    name: Publish GitHub Release
    needs: [windows]
    # 装机步失败(典型:签名/更新源 secrets 未配)也照发:插件 tarball 已经在
    # windows job 里早早产出,不该跟着一起消失。取消运行时不发。
    if: ${{ !cancelled() }}
    runs-on: ubuntu-22.04

    steps:
      - name: Check out source (for CHANGELOG at the tag)
        uses: actions/checkout@v4

      - name: Download the plugin tarball artifact
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: starhub-*-${{ github.ref_name }}
          path: release-artifacts
          merge-multiple: true

      - name: Detect available assets
        # 发布资产只有插件 tarball(品牌安装包已退役)。
        id: assets
        shell: bash
        run: |
          shopt -s nullglob globstar
          tgz=(release-artifacts/**/*.tgz)
          echo "has_tgz=true" >> "$GITHUB_OUTPUT"
          echo "插件 tarball: ${tgz[*]:-（无）}"
          if [ ${#tgz[@]} -eq 0 ]; then
            echo "::error::本次运行没有插件 tarball,不创建空 Release"
            exit 1
          fi

      - name: Extract release notes from CHANGELOG.md
        # 从 CHANGELOG.md 生成 Release 正文(升级变更日志)。
        # 优先提取当前版本节(发版时改动会从 [未发布] 移到版本节);找不到版本节
        # 才回退 `## [未发布]`。
        # 提取范围:命中的 `## [` 到下一个 `---` 分隔符;剔除「### 计划中」块
        # (未发布计划,不该进已发布版本的 notes)。发版约定见 AGENTS.md 版本纪律。
        #
        # 两个坑,都是这次升 v0.128.0 时实测抓到的:
        # ① 匹配必须用**前缀正则**,不能整行相等。版本标题长这样:
        #    `## [0.128.0] - 2026-10-10`(带日期),永远不等于 `## [0.128.0]`。
        #    整行相等的写法让 active 永远是 0,提取结果恒为空——上面那个
        #    grep 用的是前缀正则所以能选中 SECTION,两边不一致,于是每个版本
        #    都走到「没提取到」。
        # ② 提取为空必须**失败**,不能只 warning。空 notes 的 Release 看起来
        #    是成功的,用户点开什么都没有,比发布失败更难发现。
        shell: bash
        env:
          REL_VERSION: ${{ github.ref_name }}   # 形如 v0.114.1
        run: |
          VER="${REL_VERSION#v}"
          if grep -q "^## \[$VER\]" CHANGELOG.md; then
            SECTION="$VER"
          else
            SECTION="未发布"
            echo "::warning::CHANGELOG.md 没有版本节 '## [$VER]',回退到 '## [未发布]' 提取"
          fi
          awk -v sec="$SECTION" '
            /^## \[/ { if (active) exit; if ($0 ~ "^## \\[" sec "\\]") active = 1; next }
            active && /^---/ { exit }
            active && /^### 计划中/ { planned = 1 }
            active && !planned { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "::error::CHANGELOG.md 里没提取到 '$SECTION' 节的正文,Release 不能不带变更日志"
            exit 1
          else
            echo "---- extracted release notes ----"
            cat RELEASE_NOTES.md
          fi

      - name: Publish plugin tarball asset
        # 纯插件形态的资产:任何一次 tag 都要拿到它(装机链的 secrets 与它无关)。
        if: steps.assets.outputs.has_tgz == 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: StarHub ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          generate_release_notes: false
          fail_on_unmatched_files: true
          files: release-artifacts/**/*.tgz

